# Ipv4_addr:该交换机的Ipv4地址
# Ipv6_addr:该交换机的Ipv6地址
# Mac_addr:该交换机的MAC地址

# Port:该换机的所有端口，以及它们与Tap口之间的对应关系
# Static_ARP,静态ARP配置，用于逐跳更新MAC地址

# SID_Table：交换机的SID表（Table1的第一部分）
# Not_Local：非本机IP网段（Table1的第二部分）
# Table2-33:32个不同vlanID的VRF转发表
# Table34:PE进入后不带VLAN的数据包要转入的table，用于给不带vlan的数据包添加srh头

# Vlan：表示所有可能出现的VlanID，可自定义

# GROUP:交换机的组表配置，包括组表的组ID和该组表的内容

# ACTIONx:自定义的动作，可以在表项的动作中引用，类似C语言中的宏，便于部分较长的action的配置。

# ----------------------------------- #
# ip_daddr_e：表示外层ipv4的目的地址
# ip_daddr_i：表示内层ipv4的目的地址
# ipv6_dst_e：表示外层ipv6的目的地址
# ipv6_dst_i：表示内层ipv6的目的地址

